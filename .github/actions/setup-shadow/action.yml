name: Setup Shadow
description: Install the pinned Shadow CLI
runs:
  using: composite
  steps:
    - name: Cache Shadow binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/shadow
        key: shadow-${{ runner.os }}-${{ runner.arch }}-ceaaac778ab433f6666957facbf68eeb7c58b918
    - name: Install Shadow
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --git https://github.com/AzurIce/shadow --rev ceaaac778ab433f6666957facbf68eeb7c58b918 --locked
